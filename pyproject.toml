[project]
name = "flipper-client"
version = "1.3.2"
description = "Flipper is a lightweight, easy to use, and flexible library for feature flags in python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
    "cachetools>=4.2.1,<6",
    "python-consul>=1.0,<2",
    "redis>=2.10.6,<5",
    "thrift>=0.13,<1",
    "boto3>=1.9,<2",
    "pyee>=6.0,<7",
]

[project.optional-dependencies]
postgres = ["psycopg>=3.0.10,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flipper", "flipper_thrift"]

[tool.hatch.build.targets.sdist]
include = ["flipper", "flipper_thrift"]

[dependency-groups]
dev = [
    "six>=1.12",
    "fakeredis>=1.0,<2",
    "pytest>=7.1",
    "ipython",
    "thrift",
    "ipdb",
    "black==22.1.0",
    "pre-commit",
    "isort",
    "flake8",
    "mypy",
    "moto",
    "bandit",
    "twine",
    "testing.postgresql",
    "ruff>=0.6",
]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | logs
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
